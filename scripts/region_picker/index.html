<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#234}button{font:inherit;border:1px solid #bed0df;border-radius:5px;background:#fff;padding:6px 12px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#e4f1fc;border-color:#126bb0}#viewport{overflow:auto;max-height:550px;background:#edf0f3;border:1px solid #d5e0e7;border-radius:8px}canvas{display:block;touch-action:none}#help{margin:6px;color:#586c7c}
</style><div><button id="select" aria-pressed="true">點選預測框</button><button id="draw" aria-pressed="false">圈選爭議區域</button><button id="zoom">放大</button><button id="reset">符合畫面</button></div><div id="viewport"><canvas id="canvas" role="img" aria-label="可點選與圈選的案件圖片" tabindex="0"></canvas></div><p id="help">點選框；需要新增或修正範圍時，選「圈選爭議區域」後拖曳。</p>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),img=new Image();let args={},mode='select',zoom=1,start=null,end=null,lastSrc='';
function send(type,extra){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function emit(value){send('streamlit:setComponentValue',{value:{...value,nonce:Date.now()+Math.random()},dataType:'json'})}
function resize(){if(!img.naturalWidth)return;const w=Math.min(Math.max(200,document.body.clientWidth-4),img.naturalWidth)*zoom;c.width=Math.round(w);c.height=Math.round(w*img.naturalHeight/img.naturalWidth);paint();send('streamlit:setFrameHeight',{height:Math.min(c.height,550)+85})}
function box(roi,color,label,dash=false){const [x,y,r,b]=roi;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash(dash?[7,4]:[]);ctx.strokeRect(x*c.width,y*c.height,(r-x)*c.width,(b-y)*c.height);ctx.setLineDash([]);if(label){ctx.font='14px sans-serif';const tw=ctx.measureText(label).width;ctx.fillStyle=color;ctx.fillRect(x*c.width,Math.max(0,y*c.height-20),tw+8,20);ctx.fillStyle='white';ctx.fillText(label,x*c.width+4,Math.max(15,y*c.height-5))}}
function paint(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);(args.boxes||[]).forEach(b=>box(b.roi,b.id===args.selected_id?'#006fcc':b.kind==='truth'?'#18774c':b.kind==='manual'?'#965ac5':'#db6327',b.label||'',b.kind==='manual'));if(args.roi)box(args.roi,'#008873','目前圈選',true);if(start&&end)box([Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])],'#008873','',true)}
function point(e){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
c.onpointerdown=e=>{if(args.disabled)return;start=point(e);end=start;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(start&&mode==='draw'){end=point(e);paint()}};
c.onpointerup=e=>{if(!start)return;end=point(e);if(mode==='draw'){let roi=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])];if((roi[2]-roi[0])*c.width>=3&&(roi[3]-roi[1])*c.height>=3){args.roi=roi;emit({action:'draw',roi})}}else{const [x,y]=end;const rows=(args.boxes||[]).filter(b=>b.roi[0]<=x&&x<=b.roi[2]&&b.roi[1]<=y&&y<=b.roi[3]).sort((a,b)=>(a.roi[2]-a.roi[0])*(a.roi[3]-a.roi[1])-(b.roi[2]-b.roi[0])*(b.roi[3]-b.roi[1]));if(rows.length){args.selected_id=rows[0].id;emit({action:'select',id:rows[0].id})}}start=end=null;paint()};
c.onpointercancel=()=>{start=end=null;paint()};
['select','draw'].forEach(id=>document.getElementById(id).onclick=()=>{mode=id;['select','draw'].forEach(x=>document.getElementById(x).setAttribute('aria-pressed',String(x===id)));c.style.cursor=id==='draw'?'crosshair':'pointer'});
document.getElementById('zoom').onclick=()=>{zoom=Math.min(4,zoom+0.5);resize()};document.getElementById('reset').onclick=()=>{zoom=1;resize()};img.onload=resize;
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;args=e.data.args||{};document.getElementById('draw').disabled=args.allow_draw===false;if(args.image!==lastSrc){lastSrc=args.image;img.src=lastSrc}else resize()});window.addEventListener('resize',resize);send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:300});
</script></html>
