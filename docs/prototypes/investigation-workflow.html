<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>LV 查案操作原型</title>
<style>body{font:16px system-ui;margin:32px auto;max-width:1100px;color:#183044;background:#f4f7fa}header,main{background:white;border:1px solid #dae2e9;border-radius:12px;padding:24px;margin-bottom:18px}button,select,textarea{font:inherit;padding:10px;margin:5px;border:1px solid #becdd8;border-radius:6px}button{cursor:pointer;background:#edf5fd}button.primary{background:#145fa1;color:white}nav{display:flex;gap:5px;flex-wrap:wrap}nav button[aria-current=true]{outline:2px solid #145fa1}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.note{color:#667987}svg{max-width:100%;background:#e7eaec;border-radius:10px}textarea{width:90%;height:110px}.good{color:#17673c}.warn{color:#925614}</style>
<header><strong>LV 誤逮調查</strong><span class="note"> · 操作原型，使用固定範例，不執行模型</span><p>從報案到可引用回覆；素材不完整也能先保留案件。</p>
<label>走查情境 <select id="scenario"></select></label><p id="story"></p><nav id="nav"></nav></header>
<main><div class="row"><section><h2 id="title"></h2><p id="status"></p><div id="content"></div><div id="actions"></div></section>
<section><svg id="image" viewBox="0 0 480 320" role="img" aria-label="報案影像與可選框"><rect x="40" y="55" width="400" height="210" fill="#b9c1c5"/><path d="M120 90 L160 140 L150 230" stroke="#f9fdff" stroke-width="14" fill="none"/><path d="M315 90 L295 170 L325 230" stroke="#333" stroke-width="4" fill="none"/><g id="boxes"><rect data-box="反光爭議框" x="95" y="75" width="100" height="170" fill="transparent" stroke="#e06538" stroke-width="3"/><rect data-box="真瑕疵框" x="275" y="75" width="80" height="170" fill="transparent" stroke="#236b94" stroke-width="3"/></g></svg><p id="selected">尚未選框</p><p class="note">圖片原型：點框選目標；實作版支援圈區、修正與放大。</p></section></div><hr><p id="event" aria-live="polite"></p><button id="back">返回上一步</button><button id="save">保存草稿</button></main>
<script>
const stories={U01:'只有截圖和描述，沒有模型',U02:'由模型庫匯入模型並試跑',U03:'ONNX 已有，稍後才補 PT',U04:'相同模型在兩個站點用不同門檻',U05:'十張圖含同名檔與空預測，匯入前核對',U06:'同圖一真一誤，第一次選錯框',U07:'報案有框，本機重播沒有框',U08:'熱圖全零或實驗與假設相反',U09:'框相同，但現場有未知機台規則',U10:'需要圖文回覆與工程附錄',U11:'找同類圖片並送人工覆核',U12:'覆核後匯出訓練資料，比較新版模型'};
const steps=['收到報案','核對判定','選框查證','整理回覆','覆核與改善'];let stage=0,chosen='',events=[];
const el=id=>document.getElementById(id),sc=el('scenario');Object.entries(stories).forEach(([k,v])=>sc.add(new Option(k+' · '+v,k)));
function note(text){events.push(text);el('event').textContent=text}
function action(text,fn,primary=false){const b=document.createElement('button');b.textContent=text;b.className=primary?'primary':'';b.onclick=fn;el('actions').append(b)}
function go(n){stage=n;render()}
function render(){const s=sc.value;el('story').textContent=stories[s];el('title').textContent=steps[stage];el('nav').replaceChildren();steps.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.setAttribute('aria-current',String(i===stage));b.onclick=()=>go(i);el('nav').append(b)});el('actions').replaceChildren();el('content').replaceChildren();el('status').textContent='';
 if(stage===0){el('content').innerHTML='<p>報案圖片／截圖、描述、可選現場紀錄</p><textarea aria-label="報案描述">使用者認為左侧反光正常，卻被判為刮傷。</textarea>';action('上傳圖片與紀錄',()=>note(s==='U05'?'預覽：10 張，1 筆待配對；空預測已區分缺檔':'原型素材已選取'));action('先建立案件',()=>{note('案件已保留，未知模型不阻擋建案');go(1)},true)}
 if(stage===1){el('status').textContent=s==='U01'?'尚缺原圖／模型，可以先記錄與回覆':s==='U03'?'可重播；Grad-CAM 尚需對應 PT':s==='U09'?'模型輸出可核對；機台規則未知':'模型與站點設定尚待試跑';el('content').innerHTML='<label>模型／站點 <select aria-label="模型與站點"><option>A 線 v3 · 門檻 0.25</option><option>B 線 v3 · 門檻 0.50</option></select></label>';action('匯入自己的模型',()=>note('上傳 → 檢查能力 → 核對必要設定 → 試跑'));action('試跑此圖',()=>{note(s==='U07'?'本次完整輸出零框，與報案不一致':'範例試跑完成；尚未確認現場歷史');go(2)},true);action('資料稍後補，繼續查案',()=>go(2))}
 if(stage===2){el('status').textContent=s==='U07'?'本次無框：可對照報案 ROI，不能假造 detector target':s==='U08'?'沒有正向歸因／有反例：保留未確認狀態':'選中哪個框，就解釋哪個框';action('圈選／修正區域',()=>{chosen='人工爭議區域';el('selected').textContent=chosen;note('原框與舊證據保留，受影響引用標為待重看')});action('解釋這個框',()=>note(['U01','U03','U07'].includes(s)?'缺可用歸因目標；可改做對照或補資料':'範例：YOLO 分數歸因，與 LV 輔助對照分開'));action('找同類對照',()=>note('可上傳正常／瑕疵對照或選已有資料集'));action('保存證據並整理回覆',()=>go(3),true)}
 if(stage===3){el('content').innerHTML='<textarea aria-label="可編輯回覆">報案影像已保存。目前原因尚未確認，需核對原圖、模型與現場設定。附圖僅代表本次爭議區域。</textarea><p>選取附圖與證據；支持／反駁都可引用。</p>';action('預覽圖文回覆',()=>note('可攜 HTML 預覽；工程附錄另附，不自動發送'));action('標記已回覆',()=>note('已回覆；原因仍未確認'));action('送同類案例覆核',()=>go(4),true)}
 if(stage===4){el('content').innerHTML='<p>候選 → 人工覆核 → 完整標註確認 → 訓練交接</p><label>真瑕疵類別 <select><option>刮傷</option><option>裂紋</option></select></label><p>選新舊模型、上傳評估圖片與真值、確認資料用途。</p>';action('預覽訓練交接',()=>note('局部正常不視為整張正常；待覆核不可匯出正式標籤'));action('比較誤逮與漏檢',()=>note('範例只展示操作，沒有計算改善成績'));action('回到案件',()=>go(0),true)}
}
sc.onchange=()=>{chosen='';el('selected').textContent='尚未選框';go(0)};el('back').onclick=()=>go(Math.max(0,stage-1));el('save').onclick=()=>note('草稿已保留（原型 session）');el('image').onclick=e=>{if(e.target.dataset.box){chosen=e.target.dataset.box;el('selected').textContent='目前選擇：'+chosen;note('選框已更新，沒有更換原始模型輸入')}};render();
</script></html>
